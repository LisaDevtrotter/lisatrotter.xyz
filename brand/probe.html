<!doctype html>
<!-- test harness: loads the site in a frame, then writes a few computed values into #out (read with --dump-dom) -->
<html><head><meta charset="utf-8"><style>html,body{margin:0;height:100%}iframe{border:0;width:1440px;height:900px}</style></head>
<body><iframe id="f" src="../index.html"></iframe><pre id="out">waiting</pre>
<script>
var f = document.getElementById("f");
f.onload = function () {
  setTimeout(function () {
    var d = f.contentWindow.document, out = [];
    d.querySelectorAll(".scribble").forEach(function (s, i) {
      var p = s.querySelector("path"), cs = f.contentWindow.getComputedStyle(p);
      var an = p.getAnimations().map(function (a) { return a.constructor.name + ":" + a.playState + "@" + Math.round(a.currentTime) + "/" + (a.effect && a.effect.getTiming().duration); }).join(",");
      out.push(i + " cls=" + s.getAttribute("class") + " off=" + cs.strokeDashoffset + " arr=" + cs.strokeDasharray + " tr=" + cs.transitionProperty + "|" + cs.transitionDuration + " anim=[" + an + "] reduced=" + f.contentWindow.matchMedia("(prefers-reduced-motion: reduce)").matches);
    });
    document.getElementById("out").textContent = out.join("\n");
  }, 6000);
};
</script></body></html>
